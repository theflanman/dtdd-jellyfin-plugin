  summary: >-
    Builds the tag name for a trigger, optionally appending the confidence

    percentage (rounded to the nearest 5%) when enabled in configuration.
  example: []
  syntax:
    content: public static string? FormatTagName(string prefix, DtddTopicItemStat trigger, PluginConfiguration config)
    parameters:
    - id: prefix
      type: System.String
      description: The tag prefix (e.g. "CW:" or "Safe:").
    - id: trigger
      type: Jellyfin.Plugin.DoesTheDogDie.Api.Models.DtddTopicItemStat
      description: The trigger to format.
    - id: config
      type: Jellyfin.Plugin.DoesTheDogDie.Configuration.PluginConfiguration
      description: The plugin configuration.
    return:
      type: System.String
      description: The formatted tag name, or null if the trigger has no topic.
    content.vb: Public Shared Function FormatTagName(prefix As String, trigger As DtddTopicItemStat, config As PluginConfiguration) As String
