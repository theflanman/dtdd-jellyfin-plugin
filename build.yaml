overview: "Display content warnings from DoesTheDogDie.com"
description: >
  Integrates with DoesTheDogDie.com to display content warnings
  and trigger information for movies and TV shows in Jellyfin.
  Fetches triggers (animal death, violence, jump scares, etc.)
  and adds them as metadata tags to movies and TV shows.
category: "General"
owner: "theflanman"
artifacts:
# jprm's `plugin build` copies each entry with a plain file copy (jprm/__init__.py package_plugin ->
# shutil.copyfile per artifact) — it does not glob or accept directories, so every file the plugin
# needs at runtime must be listed individually. This is the full `dotnet publish -c Release` output
# for Jellyfin.Plugin.DoesTheDogDie (net9.0), minus the .pdb/.xml/.deps.json Jellyfin doesn't need,
# and minus runtimes/win-*/native/*.dll, which the plugin's own publish target deletes (see the
# RemoveNativeWindowsLibrariesFromPublish comment in Jellyfin.Plugin.DoesTheDogDie.csproj) because
# Jellyfin's PluginManager loads every *.dll it finds recursively and disables the plugin on a
# native one. Consequence: Windows hosts get no bundled SQLite native and fall back to an
# in-memory cache; Linux/macOS use the .so/.dylib entries below and get the persistent SQLite cache.
