changelog: |
  - Migrated to the DoesTheDogDie v3 API via the external DoesTheDogDie client library
  - Requires a user-supplied DoesTheDogDie.com API key (Dashboard -> Plugins -> Does The Dog Die);
    with no key set, the plugin makes no requests and tags nothing
  - Trigger verdicts (CW: / Safe:) are now driven by a Beta-distribution confidence model over
    DtDD's vote counts, rather than a raw vote threshold; uncertain triggers get no tag
  - Descriptions, when enabled, show triggers grouped by verdict with vote counts and credible
    intervals, e.g. "a dog dies (18/20, 72-96%)"
  - Mandatory "Powered by DoesTheDogDie.com" attribution on every injected description and on the
    configuration page, per DtDD's terms of service
  - New optional setting IncludeTopComment adds each trigger's top user comment to the description;
    it costs one extra DtDD API request per title against the free tier's 5,000/month budget, and
    is off by default
  - Removed settings that no longer apply: MinVotesThreshold, EnableBooks, CacheDurationHours,
    RefreshIntervalHours, UseConfidenceScoring, MinConfidenceThreshold, and HideSpoilerComments
    (v3 exposes no spoiler flag, so it could not be honored)
  - ACTION REQUIRED when upgrading: if you set Enabled Category IDs previously, clear and re-select
    them. DtDD restructured its categories in v3 (a handful of coarse ones became 43, and topics
    moved between them - "a dog dies" was category 2, now 56), so a saved selection now matches the
    wrong categories. The plugin does not reset it for you, and the symptom is quiet: warnings you
    did not ask for and missing ones you did. Worse, every refresh strips all CW:/Safe: tags before
    rewriting them, so a stale selection that now matches nothing DELETES your existing content
    warning tags on the first refresh rather than leaving them alone. Enabled Topic IDs and stored
    item IDs are unaffected
  - Known caveat: on Windows, the bundled SQLite native library is not shipped (see artifacts note
    above), so the DtDD cache falls back to in-memory and does not persist across restarts; Linux
    and macOS get the persistent SQLite cache
  - Fixed the DoesTheDogDie client library's NuGet fallback, which referenced a nonexistent package
    id with no version and would fail restore for anyone without the library checked out as a
    sibling repo
  - Config page: category headers can now be expanded/collapsed regardless of whether the category
    is enabled; selecting an individual topic now enables just that topic and its category instead
    of being silently dropped or forcing every sibling topic on; fixed the page's script re-running
    on repeat navigation, which could silently discard in-progress selections and double-save on
    every click
  - Injected descriptions are now formatted as a heading plus a bulleted list per verdict, with each
    trigger's top comment nested underneath it, instead of one comma-joined line per verdict
  - Fixed two description rendering bugs: the leading heading no longer renders as literal "#" text,
    and a multi-line DtDD comment no longer corrupts the heading levels of every section after it
